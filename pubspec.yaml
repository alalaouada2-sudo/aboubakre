name: quran_reels_maker
description: Professional offline-first Quran short-video creator for TikTok and YouTube Shorts.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^14.2.0
  provider: ^6.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4
  ffmpeg_kit_flutter_new_min_gpl: ^6.0.3
  just_audio: ^0.9.40
  share_plus: ^10.0.2
  video_player: ^2.9.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/quran/
    - assets/readers/
    - assets/backgrounds/
