{% extends "base.html" %}
{% block title %}المساعد الذكي | مدونة الكون{% endblock %}
{% block content %}
<section class="panel">
  <h3>المساعد الفلكي الذكي</h3>
  <p>اكتب سؤالك وسيتم الرد من واجهة Python API مباشرة.</p>

  <div id="chatBox" class="chat-box">
    <div class="msg bot">مرحبًا 👋 أنا جاهز للإجابة عن أسئلتك حول الكون.</div>
  </div>

  <form id="chatForm" class="chat-form" data-api-url="/api/assistant">
    <input id="userInput" type="text" placeholder="مثال: ما هو السديم؟" required />
    <button type="submit">إرسال</button>
  </form>
</section>
{% endblock %}
